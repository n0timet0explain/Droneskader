<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Droneskader</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <span id="logo" aria-label="STØD Medical"></span>
        <h1 data-i18n="title">Droneskader</h1>
      </div>
      <span class="stamp" id="stamp"></span>
      <div class="toggle" id="lang">
        <button data-lang="da">DA</button>
        <button data-lang="en">EN</button>
      </div>
    </header>
    <main>
      <aside id="left">
        <section>
          <span class="label" data-i18n="layers"></span>
          <div id="layer-list"></div>
          <label class="slider">
            <span class="label" data-i18n="skinOpacity"></span>
            <input id="skin-opacity" type="range" min="0.1" max="1" step="0.05" value="1" />
          </label>
        </section>
        <section>
          <span class="label" data-i18n="munitions"></span>
          <div id="munition-list"></div>
        </section>
      </aside>
      <div id="viewport">
        <div id="views">
          <button data-view="front" data-i18n="front"></button>
          <button data-view="side" data-i18n="side"></button>
          <button data-view="back" data-i18n="back"></button>
          <button data-view="top" data-i18n="top"></button>
        </div>
        <div id="coords"></div>
      </div>
      <aside id="right"><div id="info"></div></aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
