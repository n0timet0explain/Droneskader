<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Droneskader 3D</title>
  </head>
  <body>
    <header>
      <h1>Droneskader <span>· 3D førstehjælpstræner</span></h1>
      <div id="views">
        <button data-view="front">Forfra</button>
        <button data-view="side">Side</button>
        <button data-view="back">Bagfra</button>
        <button data-view="top">Top</button>
      </div>
    </header>
    <main>
      <aside id="controls">
        <section>
          <h2>Udrustning</h2>
          <div id="presets" class="seg"></div>
          <div id="gear-list"></div>
          <label class="slider">Synlighed af udrustning
            <input id="gear-opacity" type="range" min="0.15" max="1" step="0.05" value="1" />
          </label>
        </section>
        <section>
          <h2>Detonation</h2>
          <label class="field">Retning <select id="direction"></select></label>
          <label class="slider">Afstand <output id="distance-out">1.5 m</output>
            <input id="distance" type="range" min="0.5" max="4" step="0.1" value="1.5" />
          </label>
          <div class="row">
            <button id="simulate" class="primary">Simulér</button>
            <button id="reset">Nulstil</button>
          </div>
        </section>
        <p class="disclaimer">Illustrativ model – ikke en ballistisk simulering. Procenterne er pædagogiske eksempler. Medicinsk indhold bygger på TCCC-principper og skal valideres før undervisning.</p>
      </aside>
      <div id="viewport"></div>
      <aside id="info"></aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
